<!doctype html>
<html lang="en">
<head>
  <!-- Instant Clean URL Canonicalizer: Automatically strips /index.html from the address bar -->
  <script>
    (function() {
      try {
        if (window.location.pathname.endsWith('/index.html') || window.location.pathname === '/index.html') {
          var cleanPath = window.location.pathname.replace(/\/index\.html$/, '/');
          var cleanUrl = cleanPath + window.location.search + window.location.hash;
          window.history.replaceState(null, document.title, cleanUrl);
        }
      } catch (e) {}
    })();
  </script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Opening C2S Premium Study Library...</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    window.location.replace("library/");
  </script>
  <style>
    body { margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; background:#0a192f; color:#fff; font-family:system-ui,-apple-system,sans-serif; text-align:center; }
    .loader { width:48px; height:48px; border:4px solid rgba(255,255,255,0.2); border-top-color:#10b981; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 20px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>

  </div>
</body>
</html>
